services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: servicebox
      POSTGRES_PASSWORD: servicebox
      POSTGRES_DB: servicebox
    ports:
      - "5432:5432"
    volumes:
      - servicebox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicebox"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - servicebox-redis:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: servicebox
      MINIO_ROOT_PASSWORD: servicebox123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - servicebox-minio:/data

volumes:
  servicebox-postgres:
  servicebox-redis:
  servicebox-minio:
